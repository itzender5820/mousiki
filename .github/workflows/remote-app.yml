# Builds the Android app of the remote control (remote_app/android) and offers the APK as a download.
# Actions tab -> "Remote app (Android)" -> the latest run -> Artifacts -> mousiki-remote-apk.
name: Remote app (Android)

on:
  workflow_dispatch:
  push:
    paths:
      - 'remote_app/android/**'
      - '.github/workflows/remote-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78   # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      # The runner image already has the Android SDK; the setup-android action fails on it ("Failed to find package 'tools'").
      # Accept the licences so Gradle may fetch the platform it needs.
      - name: Accept the Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build the APK
        working-directory: remote_app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk mousiki-remote.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: mousiki-remote-apk
          path: remote_app/android/mousiki-remote.apk
