# CodeQL code scanning for the C++ code (src/, src_radio/, src_audio_book/) and the workflows, without the vendored third_party/ libraries.
# Results: Security tab -> Code scanning. Replaces GitHub's "default setup": switch that off first
# (Settings -> Advanced Security -> CodeQL analysis -> ... -> Disable CodeQL), otherwise the two clash.
#
# CodeQL's own "paths-ignore" does not work for C/C++ (it is built by tracing the compiler), so the C++ results are filtered
# afterwards: the SARIF file is stripped of everything in third_party/ and tests/ and only then uploaded.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A newer push to the same branch / pull request cancels the run that is still going: no red runs for half-finished uploads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpp:
    name: c-cpp
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066   # v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4

      - name: Analyze (results are kept, not uploaded yet)
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066   # v4
        with:
          category: "/language:c-cpp"
          upload: never
          output: sarif-results

      - name: Remove the vendored libraries and the tests from the results
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0   # v1.1
        with:
          patterns: |
            -third_party/**
            -tests/**
          input: sarif-results/cpp.sarif
          output: sarif-results/cpp.sarif

      - name: Upload the filtered results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066   # v4
        with:
          sarif_file: sarif-results/cpp.sarif
          category: "/language:c-cpp"

  actions:
    name: actions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066   # v4
        with:
          languages: actions
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066   # v4
        with:
          category: "/language:actions"
