# Opens a pull request when a GitHub Action used by the workflows has a newer version.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      # All steps of github/codeql-action (init, analyze, upload-sarif) must run the same version, or CodeQL fails with
      # "Loaded a configuration file for version X, but running version Y": one pull request updates them together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
